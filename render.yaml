# Render Blueprint: Dashboard -> New -> Blueprint -> GitHub-Repo wählen.
# Die mit sync: false markierten Werte trägst du im Dashboard selbst ein.
services:
  - type: web
    name: fc-m-sys
    runtime: node
    plan: free
    buildCommand: echo "keine Abhängigkeiten"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: KINDE_DOMAIN
        sync: false
      - key: KINDE_CLIENT_ID
        sync: false
      - key: KINDE_CLIENT_SECRET
        sync: false
      - key: KINDE_ORG_CODE
        sync: false
      - key: KINDE_AUDIENCE
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
